[project]
name = "medquery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SaieshSharma", email = "saiesh.techscribe@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
medquery = "medquery:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
